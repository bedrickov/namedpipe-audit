name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and Test
        run: |
          cl /std:c++20 /EHsc /O2 tests/test_main.cpp /Fenamedpipe_tests.exe
          .\namedpipe_tests.exe
          cl /std:c++20 /EHsc /O2 src/main.cpp /Fenamedpipe_audit.exe
